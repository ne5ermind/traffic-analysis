services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/innova/data
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      INNOVA_DEVICE: cpu
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    volumes:
      - ./data:/srv/innova/data
    cpus: 3.0
    mem_limit: 5g
    restart: unless-stopped
